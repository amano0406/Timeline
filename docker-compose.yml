name: timeline

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - type: volume
        source: ollama
        target: /root/.ollama
    gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: timeline-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Timeline__HelperBaseUrl: http://host.docker.internal:${TIMELINE_HELPER_PORT:-19001}
      Timeline__HelperPublicBaseUrl: http://127.0.0.1:${TIMELINE_HELPER_PORT:-19001}
    ports:
      - "19000:8080"

  worker:
    image: timeline-worker:latest
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      Timeline__WorkDirectory: /data/work
      Timeline__StoreDirectory: /data/store
    volumes:
      - type: bind
        source: ${TIMELINE_WORK_SOURCE:-./data/work}
        target: /data/work
      - type: bind
        source: ${TIMELINE_STORE_SOURCE:-./data/to_timeline}
        target: /data/store

volumes:
  ollama:
